services:
  - type: web
    name: cachebot-app
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: BYN
      - key: DATABASE_URL
        fromDatabase:
          name: cachebot-postgres
          property: connectionString
      - key: WEBAPP_URL
        fromService:
          type: web
          name: cachebot-app
          property: host
          transform: "https://${host}/app?v=4.0"

databases:
  - name: cachebot-postgres
    plan: free
    region: frankfurt
    databaseName: cachebot_db
    user: cachebot_user
