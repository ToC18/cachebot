services:
  - type: web
    name: cachebot-app
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_XGcNPU3dfQi1@ep-falling-scene-b90cwx8b.c-7.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: BYN
      - key: WEBAPP_URL
        fromService:
          type: web
          name: cachebot-app
          property: host
          transform: "https://${host}/app?v=4.0"
